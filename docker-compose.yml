services:
  postgres:
    image: postgres:17
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity_service
      POSTGRES_USER: identity_service
      POSTGRES_PASSWORD: identity_service
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U identity_service -d identity_service" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: identity-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  kafka:
    image: apache/kafka:4.3.1
    container_name: identity-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: identity-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic outbox.events --partitions 3 --replication-factor 1"
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-migrate
    entrypoint: [ "/app/migrate" ]
    environment:
      APP_ENVIRONMENT: local
      APP_NAME: identity-service
      APP_VERSION: local

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: identity_service
      DATABASE_USER: identity_service
      DATABASE_PASSWORD: identity_service

      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-service
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      HTTP_READ_TIMEOUT: 5s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 1m
      HTTP_SHUTDOWN_TIMEOUT: 10s

      TIMEOUTS_DATABASE_QUERY: 2s
      TIMEOUTS_REDIS_COMMAND: 500ms
      TIMEOUTS_KAFKA_PRODUCE: 5s
      TIMEOUTS_KAFKA_CONSUME: 10s

      APP_ENVIRONMENT: local
      APP_NAME: identity-service
      APP_VERSION: local

      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Authorization,Content-Type,X-Request-ID

      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      GRPC_SHUTDOWN_TIMEOUT: 10s

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: identity_service
      DATABASE_USER: identity_service
      DATABASE_PASSWORD: identity_service
      DATABASE_POOL_MAX_CONS: 10
      DATABASE_POOL_MIN_CONS: 1
      DATABASE_POOL_MAX_CON_LIFE_TIME: 1h
      DATABASE_POOL_MAX_CON_IDLE_TIME: 20m
      DATABASE_POOL_HEALTH_CHECK_PERIOD: 1m

      KAFKA_BROKERS: kafka:9092
      KAFKA_OUTBOX_TOPIC: outbox.events
      KAFKA_PRODUCER_BATCH_MAX_BYTES: 1048576
      KAFKA_PRODUCER_LINGER: 10ms
      KAFKA_CONSUMER_GROUP: identity-service

      AUTH_JWT_SECRET: local-dev-secret-change-me-please-32
      AUTH_ACCESS_TOKEN_TTL: 15m
      AUTH_REFRESH_TOKEN_TTL: 720h

      WORKER_INTERVAL: 5s
      WORKER_BATCH_SIZE: 10
      WORKER_MAX_ATTEMPTS: 3
      WORKER_LOCK_TIMEOUT: 1m
      WORKER_PROCESS_TIMEOUT: 30s

      TELEMETRY_ENABLED: false
      TELEMETRY_EXPORTER: stdout
      TELEMETRY_ENDPOINT: localhost:4317
      TELEMETRY_INSECURE: true
      TELEMETRY_SAMPLE_RATIO: 1.0

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      CACHE_USER_TTL: 5m

      LOG_LEVEL: info
    ports:
      - "8080:8080"
      - "50051:50051"
    healthcheck:
      test: [ "CMD", "/app/healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
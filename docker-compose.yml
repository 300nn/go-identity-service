services:
  postgres:
    image: postgres:17
    container_name: go-crud-postgres
    environment:
      POSTGRES_DB: go_crud
      POSTGRES_USER: go_crud
      POSTGRES_PASSWORD: go_crud
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U go_crud -d go_crud" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-crud-migrate
    entrypoint: [ "/app/migrate" ]
    environment:
      APP_ENVIRONMENT: local
      APP_NAME: go-crud-api
      APP_VERSION: local

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: go_crud
      DATABASE_USER: go_crud
      DATABASE_PASSWORD: go_crud

      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-crud-api
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      HTTP_READ_TIMEOUT: 5s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 1m

      APP_ENVIRONMENT: local
      APP_NAME: go-crud-api
      APP_VERSION: local

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: go_crud
      DATABASE_USER: go_crud
      DATABASE_PASSWORD: go_crud
      DATABASE_POOL_MAX_CONS: 10
      DATABASE_POOL_MIN_CONS: 1
      DATABASE_POOL_MAX_CON_LIFE_TIME: 1h
      DATABASE_POOL_MAX_CON_IDLE_TIME: 20m
      DATABASE_POOL_HEALTH_CHECK_PERIOD: 1m

      LOG_LEVEL: info
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "/app/healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Check gofmt
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './internal/gen/*'))"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: Check goimports
        run: |
          files="$(goimports -l $(find . -name '*.go' -not -path './internal/gen/*'))"
          if [ -n "$files" ]; then
              echo "goimports required for:"
              echo "$files"
              exit 1
          fi

      - name: Test
        run: go test ./... -short

      - name: Govulncheck
        run: govulncheck ./...

      - name: Gosec
        run: gosec -exclude-generated ./...

  protobuf:
    name: Protobuf checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check buf format
        run: buf format --diff --exit-code

      - name: Buf lint
        run: buf lint

      - name: Generate protobuf
        run: buf generate

      - name: Check generated files are committed
        run: git diff --exit-code

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - go
      - protobuf

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: |
          docker build -t identity-service:ci .
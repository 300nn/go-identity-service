app:
  name: "go-crud-api"
  version: "user_test"
  environment: "local"

http:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  read_header_timeout: 5s
  shutdown_timeout: 10s

grpc:
  host: "0.0.0.0"
  port: 50051
  shutdown_timeout: 10s

database:
  host: "localhost"
  port: 5432
  name: "go_crud"
  user: "postgres"
  password: "change-me"
  ssl: "disable"
  pool:
    min_cons: 1
    max_cons: 10
    max_con_life_time: 1h
    max_con_idle_time: 30m
    health_check_period: 1m

auth:
  jwt_secret: "change-me-use-env-in-production-change-me-use-env-64-chars-min"
  access_token_ttl: 15m
  refresh_token_ttl: 720h

worker:
  interval: 5s
  batch_size: 10
  max_attempts: 3
  lock_timeout: 1m
  process_timeout: 30s

kafka:
  brokers: "localhost:9092"
  outbox_topic: "outbox.events"
  producer_batch_max_bytes: 1048576
  producer_linger: 10ms
  consumer_group: "go-crud-api"

cors:
  allowed_origins: "http://localhost:3000"
  allowed_methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed_headers: "Authorization,Content-Type,X-Request-ID"

redis:
  host: "localhost"
  port: 16379
  password: ""
  db: 0

timeouts:
  database_query: 2s
  redis_command: 500ms
  kafka_produce: 5s
  kafka_consume: 10s

cache:
  user_ttl: 5m

log:
  level: "info"